<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <h1>Registration Form</h1>
    <form action="#" method="post">
      <label for="name">Full Name:</label>
      <input
        type="text"
        id="name"
        name="name"
        pattern="[A-Za-z ]+"
        title="Only letters and spaces allowed."
        maxlength="50"
        placeholder="Enter your full name"
        required
      />
      <br />
      <br />

      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        required
        placeholder="email@example.com"
      />
      <br />
      <br />

      <label for="password">password:</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        minlength="8"
        maxlength="20"
        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}"
        title="Must contain at least one uppercase letter, one lowercase letter, one number, and one special character."
        required
      />
      <br />
      <br />

      <label for="cPassword">Confirm Password:</label>
      <input
        type="password"
        id="cPassword"
        name="cPassword"
        placeholder="Re-enter password"
        minlength="8"
        maxlength="20"
        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}"
        title="Must contain at least one uppercase letter, one lowercase letter, one number, and one special character."
        required
      />
      <br />
      <br />

      <label for="phone">Phone Number:</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="9090909090"
        required
      />
      <br />
      <br />

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" /> <br />
      <br />

      <label for="time">Available time</label>
      <input type="time" id="time" name="time" /> <br /><br />

      <!-- <fieldset>
        <legend>Select Your Gender:</legend>
        <label><input type="radio" name="gender" value="Male" />Male</label>
        <label><input type="radio" name="gender" value="Female" />Female</label>
        <label><input type="radio" name="gender" value="Others" />Others</label>
      </fieldset> -->

      <label for="gender">Select Your Gender:</label> <br />
      <input type="radio" name="gender" id="male" value="Male" />
      <label for="male">Male</label> <br />

      <input type="radio" name="gender" id="female" value="Female" />
      <label for="female">Female</label> <br />

      <input type="radio" name="gender" id="other" value="Other" />
      <label for="other">Others</label> <br />
      <br />

      <label for="country">Select Your Country:</label> <br />
      <select name="country" id="country">
        <option value="india">India</option>
        <option value="usa">United States</option>
        <option value="uk">UK</option>
        <option value="canada">Canada</option>
        <option value="china">China</option>
        <option value="srilanka">Sri Lanka</option>
      </select>
      <br />
      <br />

      <label>Intrests:</label>
      <label
        ><input type="checkbox" name="interests[]" value="sports" />
        Sports</label
      >
      <label
        ><input type="checkbox" value="music" name="interests[]" /> Music</label
      >
      <label
        ><input type="checkbox" value="travel" name="interests[]" />
        Travel</label
      >
      <label
        ><input type="checkbox" value="reading" name="interests[]" />
        Reading</label
      >
      <br />
      <br />

      <label for="experience">Years of Experience:</label>
      <input
        type="number"
        id="experience"
        name="experience"
        min="0"
        max="50"
        step="1"
        value="1"
      />
      <br />
      <br />

      <label for="languages">Languages:</label> <br />
      <label for="telugu">
        Telugu
        <input
          type="range"
          id="telugu"
          name="telugu"
          min="0"
          max="100"
          value="50"
        />
      </label>
      <br />
      <label for="hindi">
        Hindi
        <input
          type="range"
          id="hindi"
          name="hindi"
          min="0"
          max="100"
          value="50"
        />
      </label>
      <br />
      <label for="english">
        English
        <input
          type="range"
          id="english"
          name="english"
          min="0"
          max="100"
          value="50"
        />
      </label>
      <br />
      <br />

      <label for="resume">Resume:</label>
      <input type="file" name="resume" id="resume" /> <br />
      <br />

      <label for="comments">Comments:</label> <br />
      <textarea
        name="comments"
        id="comments"
        cols="30"
        rows="10"
        placeholder="Write your message here..."
      ></textarea>
      <br />
      <br />

      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
